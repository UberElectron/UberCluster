apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  interval: 15m
  chart:
    spec:
      chart: pgadmin
      version: 21.0.2
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  releaseName: pgadmin
  timeout: 10m
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    TZ: Europe/Madrid
    credentials:
      minio:
        name: minio
        type: s3
        bucket: backup
        path: ""
        url: ${S3_PVC_URL}
        accessKey: ${S3_PVC_ACCESSKEY}
        encrKey: ${S3_PVC_ENCRYPTKEY}
        secretKey: ${S3_PVC_SECRETKEY}
    ingress:
      main:
        enabled: false
    persistence:
      config:
        volsync:
          - name: config
            type: restic
            credentials: minio
            dest:
              enabled: true
            src:
              enabled: true
    service:
      main:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: ""
        ports:
          main:
            port: 10024
            targetPort: 8080
        integrations:
          metallb:
            enabled: true
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                PGADMIN_DEFAULT_EMAIL: ${PGADMIN_ADMIN_EMAIL}
                PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_ADMIN_PASSWORD}
